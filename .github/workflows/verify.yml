name: Verificar PD Tools
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checagens:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Configurar Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Preparar lockfile de dependências (sem scripts)
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          echo PDTOOLS_LOCK_BEGIN
          base64 -w 0 package-lock.json
          echo
          echo PDTOOLS_LOCK_END
      - name: Verificar sintaxe, catálogo e segurança
        run: node scripts/check-project.mjs
