name: Verificar PD Tools
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checagens:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Configurar Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Instalar dependências fixadas (sem scripts)
        run: npm ci --ignore-scripts --no-fund
      - name: Auditar vulnerabilidades de dependências
        run: npm audit --omit=dev --audit-level=high
      - name: Calcular integridade das bibliotecas CDN
        run: node scripts/check-cdn-sri.mjs --verify
      - name: Calcular integridade de bibliotecas PDF e OCR
        run: node scripts/check-premium-deps-sri.mjs
      - name: Verificar sintaxe, catálogo e segurança
        run: node scripts/check-project.mjs
      - name: Calcular hash do leitor QR multiplataforma
        run: |
          curl --fail --silent --show-error --location https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js -o /tmp/pd-jsQR.min.js
          calculated="$(openssl dgst -sha384 -binary /tmp/pd-jsQR.min.js | base64 -w0)"
          test "$calculated" = "hStSInNIZ8ljtOVrmrgf7zdHMapaLBWoSnPTtF0nzsybp4+LuhDz6sHuEVpWIX8o"
          echo "Leitor QR: SHA384 confirmado"
      - name: Validar funcionalidades e catálogo Premium (35)
        run: node scripts/check-premium.mjs
      - name: Smoke HTTP sem credenciais e sem pagamentos
        run: node scripts/live-smoke.mjs
      - name: Testes ampliados de segurança HTTP (sem pagamentos)
        run: node scripts/audit-security.mjs
